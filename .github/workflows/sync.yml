name: Sync actor lists

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths:
      - config.json

permissions:
  contents: write

concurrency:
  group: sync-actor-lists
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
          TMDB_USER_TOKEN: ${{ secrets.TMDB_USER_TOKEN }}
          TMDB_ACCOUNT_ID: ${{ secrets.TMDB_ACCOUNT_ID }}
        run: python sync.py

      - name: Commit and push changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add banners cache output docs
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise a jour automatique des listes et bannieres"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
